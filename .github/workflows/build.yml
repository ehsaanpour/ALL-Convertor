name: CI Build & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-pack:
    name: Build & Verify on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile C# Native Hook
        run: npm run build:native

      - name: Run Full Conversion Test Suite
        run: npm run test:conversions

      - name: Generate Brand Icons
        run: npm run generate:icons

      - name: Test Package Directory (Dry Run)
        run: npm run pack
